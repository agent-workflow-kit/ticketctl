# Example config for ticketctl.
# Location: ~/.config/ticketctl/config.yaml (drop-ins: ~/.config/ticketctl/config.d/*.yaml; --config overrides).
# Every key is shown with its default or a neutral example value. Schema: schemas/config.json.
# Top-level scalar keys also accept TICKETCTL_<KEY> from the environment (TICKETCTL_TIMEOUT,
# TICKETCTL_DEFAULT_SITE); structured keys (sites, hooks) cannot be set from the environment.

# Sites. The name is yours; selection order is --site, the site whose `projects` holds the key's
# project prefix, default_site, the only site.
sites:
  main:
    # The only provider in 0.x.
    provider: jira
    # Required. https site URL. Set allow_http: true only for a local test server.
    url: https://example.atlassian.net
    allow_http: false
    # Required: exactly one of email (not a secret) and email_env.
    email: me@example.com
    # email_env: JIRA_EMAIL
    # Required. Name of the environment variable holding the API token. The token itself never goes here.
    token_env: JIRA_API_TOKEN
    # Project keys this site owns (used by site selection). Default: [].
    projects: [ABC]
    # Board id or name for the sprint commands. Default: none (the project's one scrum board).
    board: 12
    # Logical field mappings, each by exactly one of name, id or schema. Default: {} (discovered).
    # Logical names: estimate, acceptance_criteria, sprint, parent, epic, labels, priority,
    # assignee, resolution, due_date.
    fields:
      estimate:
        name: Story Points
      # acceptance_criteria:
      #   name: Acceptance Criteria
      # sprint:
      #   schema: com.pyxis.greenhopper.jira:gh-sprint
      # Extra fields added to the output under fields.<name>.
      extra:
        team:
          name: Team
    # Named JQL queries for `search --query <name>`. Default: {}.
    queries:
      my_open: "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC"
    transitions:
      # Resolution used for a done target when --resolution is not given. Default: none.
      default_resolution: Done
      # `me` adds an assign step when a transition needs an assignee. Default: none.
      assign_on_start: me
    # Lifetime of the field-list and identity cache. Default: 24h.
    cache_ttl: 24h
    # Per-site HTTP timeouts. Defaults: 10s and 30s.
    timeouts:
      connect: 10s
      read: 30s

# Used when no other rule selects a site. Default: none.
default_site: main

# Whole-command timeout (a bare number means seconds). Default: 120 seconds.
timeout: 120s

# Who you are. name defaults to the OS user; jira is your account id.
me:
  name: me
  jira: 5b10ac8d82e05b22cc7d4ef5

# Footer on comments and created tickets. For an auto: actor the footer is mandatory.
attribution:
  enabled: true
  template: Drafted with AI assistance and posted via ticketctl.

limits:
  # Body size cap in characters of Markdown source. Default: 30000.
  body_chars: 30000
  # Longest Retry-After honored. Default: 60s.
  retry_after_max: 60s

# Hooks per kind of write: pre-/post- for transition, comment, create, update and sprint.
# Each is an ordered list of {cmd, timeout, async}; timeout defaults to 30 s; async is for post- hooks only.
# Default: {}.
hooks: {}
